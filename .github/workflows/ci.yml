name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default Linux wheel pulls ~3 GB of CUDA libs
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src app test --select E9,F63,F7,F82

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: doc-qa-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Embedding model is baked in (works offline)
        run: |
          docker run --rm --network none -e HF_HUB_OFFLINE=1 doc-qa-rag:ci \
            python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: App starts and passes health check
        run: |
          docker run -d --name app -p 8501:8501 doc-qa-rag:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
